<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistive Navigation - GPS Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 8px; }
    .status { padding: 12px; background: #f1f5f9; border-radius: 8px; }
    #map { width: 100%; height: 440px; border: 0; border-radius: 10px; margin-top: 16px; }
    button { padding: 10px 16px; margin-top: 12px; cursor: pointer; }
    .muted { color: #555; font-size: .92rem; }
  </style>
</head>
<body>
  <h1>Assistive Navigation System</h1>
  <p>GPS location monitoring</p>

  <div class="status">
    <p id="status">Loading latest location...</p>
    <p id="coordinates">Coordinates: waiting for data</p>
    <p id="updated" class="muted"></p>
  </div>

  <button id="refreshButton">Refresh location</button>
  <iframe id="map" title="GPS location on Google Maps" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

  <p class="muted">
    The ThingSpeak channel must be public for this page to read it without a
    Read API Key. Do not publish a person's live location unless they have
    agreed to share it.
  </p>

  <script>
    // Replace with your ThingSpeak channel ID.
    const CHANNEL_ID = "YOUR_CHANNEL_ID";

    async function loadLocation() {
      const status = document.getElementById("status");
      const coords = document.getElementById("coordinates");
      const updated = document.getElementById("updated");

      if (CHANNEL_ID === "YOUR_CHANNEL_ID") {
        status.textContent = "Setup required: enter your ThingSpeak channel ID in index.html.";
        return;
      }

      try {
        const endpoint =
          `https://api.thingspeak.com/channels/${encodeURIComponent(CHANNEL_ID)}/feeds/last.json`;

        const response = await fetch(endpoint, { cache: "no-store" });
        if (!response.ok) throw new Error(`ThingSpeak returned HTTP ${response.status}`);

        const feed = await response.json();
        const latitude = Number(feed.latitude);
        const longitude = Number(feed.longitude);

        if (!Number.isFinite(latitude) || !Number.isFinite(longitude) ||
            feed.latitude === null || feed.longitude === null) {
          throw new Error("No GPS coordinates have been uploaded yet.");
        }

        status.textContent = "Latest GPS location received.";
        coords.textContent =
          `Latitude: ${latitude.toFixed(6)} | Longitude: ${longitude.toFixed(6)}`;
        updated.textContent = feed.created_at
          ? `Last ThingSpeak update: ${new Date(feed.created_at).toLocaleString()}`
          : "";

        document.getElementById("map").src =
          `https://maps.google.com/maps?q=${latitude},${longitude}&z=16&output=embed`;
      } catch (error) {
        status.textContent = `Unable to load location: ${error.message}`;
      }
    }

    document.getElementById("refreshButton").addEventListener("click", loadLocation);
    loadLocation();
    setInterval(loadLocation, 20000);
  </script>
</body>
</html>
